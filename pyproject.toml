[project]
name = "bilevel-fishery"
version = "0.1.0"
description = "Bilevel optimization framework for sustainable fishery management using Evolution Strategies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Guillaume Dumas", email = "guillaume.dumas@umontreal.ca"}
]
keywords = ["bilevel-optimization", "reinforcement-learning", "sustainability", "mechanism-design", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dm-tree>=0.1.9",
    "gym>=0.26.2",
    "matplotlib>=3.10.8",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "ray[rllib,tune]==2.53.0",
    "scipy>=1.17.0",
    "seaborn>=0.13.2",
    "torch>=2.10.0",
    "wandb>=0.16,<1.0",
    "transformers>=5.4.0",
    "datasets>=4.8.4",
    "peft>=0.18.1",
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "sentencepiece>=0.2.1",
    "plotly>=6.7.0",
    "scikit-learn>=1.9.0",
]

[project.urls]
Homepage = "https://github.com/deep-introspection/bilevel-fishery"
Repository = "https://github.com/deep-introspection/bilevel-fishery"
Issues = "https://github.com/deep-introspection/bilevel-fishery/issues"

[project.optional-dependencies]
tensorboard = ["tensorboard>=2.16"]

[dependency-groups]
dev = [
    "tensorboard>=2.16",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.13",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "nbformat>=5.10",
    "spacing>=1.0.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Exclude legacy, tests and examples directories from automatic package discovery
exclude = ["legacy_code*", "tests*", "examples*"]

[tool.coverage.report]
# Most directories of core/ are namespace packages (no __init__.py). Without this
# option coverage leaves out every file that no test imports, which overstates
# the total.
include_namespace_packages = true
