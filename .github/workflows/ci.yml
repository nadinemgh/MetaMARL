
name: CI

on:
  push:
    branches: [dev, master, "chore/**", "feature/**", "fix/**"]
  pull_request:

permissions:
  contents: read

env:
  WANDB_MODE: offline

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked --group dev
      - run: uv run ruff check --no-fix .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Run unit tests and doctests
        run: |
          uv run python -m pytest \
            -m "not integration and not system and not notebook" \
            --cov-report=xml \
            --cov-fail-under=95

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Run integration and system tests
        run: |
          uv run python -m pytest \
            -m "integration or system" \
            --no-cov

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - run: uv sync --locked --group dev

      - name: Execute notebooks
        run: uv run python -m pytest -m notebook --no-cov
