[pytest]
minversion = 7.0
addopts =
    -ra
    --strict-markers
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --doctest-modules
    --ignore=examples/bilevel_fishery/debug.py
testpaths =
    tests
    core
    examples/bilevel_fishery
consider_namespace_packages = true
python_files =
    test_*.py
markers =
    unit: fast, isolated tests
    integration: multi-component tests
    system: full end-to-end tests
    notebook: executes a tutorial notebook end-to-end (slow)
pythonpath = .