[pytest]
minversion = 9.0

addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --doctest-modules

strict_xfail = true

testpaths =
    tests
    core
    examples/bilevel_fishery
    examples/cartpole

python_files =
    test_*.py

pythonpath = .

consider_namespace_packages = true

markers =
    unit: fast, isolated tests without external services
    integration: multi-component tests
    system: full end-to-end tests
    notebook: executes a tutorial notebook end-to-end (slow)