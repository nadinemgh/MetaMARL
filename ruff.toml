line-length = 88
indent-width = 4
target-version = "py312"

fix = true

[lint]
select = [
    "E",
    "F",
    "I",
    "W",
    "ISC",
    "ERA",
    "FIX",
    "TD",
    "E301",
    "E302",
    "E303",
    "E304",
    "E305",
    "E306",
]

ignore = ["W191"]

preview = true
explicit-preview-rules = true

[lint.flake8-implicit-str-concat]
allow-multiline = false

# The formatter ignores magic trailing commas (skip-magic-trailing-comma below),
# so isort must not split on them either, or the two would disagree.
[lint.isort]
split-on-trailing-comma = false
# The git-ignored run directory `wandb/` at the root would otherwise make isort
# take the wandb package for first-party code in a working copy, and sort its
# import differently there than in a clean checkout such as CI.
known-third-party = ["wandb"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"