# Bilevel cart-pole experiment: Hydra YAML runner (no Python run.py).
# Override params.algo=ppo or params.reporter=csv from the metamarl CLI.
params:
  algo: appo
  reporter: wandb
  outer_iters: 100
  train_iters: ${algorithms.${params.algo}.train_iters}
  horizon: 1000
  learning_rate: 0.001

algorithms:
  appo:
    optimizer_target: core.optimizers.appo.config.APPOptimizerConfig
    train_iters: 200
    rollout_fragment_length: 200
    batch_mode: truncate_episodes
    env_config:
      seed: 0
    training:
      episodes: ${params.train_iters}
      vtrace: true
      circular_buffer_num_batches: 2
      circular_buffer_iterations_per_batch: 1
      broadcast_interval: 5
      timeout_s_sampler_manager: 300
      timeout_s_aggregator_manager: 300
      gamma: 0.99
      lr: ${params.learning_rate}
      train_batch_size_per_learner: 200
      minibatch_size: 200
      entropy_coeff: 0.01
      grad_clip: 40.0
  ppo:
    optimizer_target: core.optimizers.ppo.config.PPOptimizerConfig
    train_iters: 100
    rollout_fragment_length: 1000
    batch_mode: complete_episodes
    env_config: {}
    training:
      episodes: ${params.train_iters}
      gamma: 0.99
      lr: ${params.learning_rate}
      train_batch_size_per_learner: 4000
      minibatch_size: 512
      entropy_coeff: 0.01
      grad_clip: 40.0

reporters:
  wandb:
    _target_: core.reporting.wandb.WandbConfig
    project: cartpole
    x_disable_stats: true
    x_disable_meta: true
    quiet: true
    max_end_of_run_summary_metrics: 0
    max_end_of_run_history_metrics: 0
  csv:
    _target_: core.reporting.csv.CSVConfig
    project: cartpole

experiment:
  _target_: core.optimizers.bilevel.BilevelConfig
  _calls_:
    - world:
        world_name: cartpole_world
    - reporter:
        config: ${reporters.${params.reporter}}
    - ray:
        device: cpu
        num_cpus: 4
        omp_threads: 1
        logging_level: ERROR
        runtime_env:
          excludes: [wandb/, .git/, .venv/, __pycache__/, ray_results/, runs/]
    - regulator:
        _args_:
          - _target_: core.optimizers.es.config.ESConfig
            _calls_:
              - training:
                  sigma: 0.5
                  mean_lr: 0.2
                  sigma_lr: 0.05
                  min_sigma: 0.01
                  max_sigma: 0.6
                  episodes: ${params.outer_iters}
              - agents:
                  _args_:
                    - _target_: core.agents.base.AgentConfig
                      id: cartpole_regulator
                      policy_id: dial_policy
                      mechanisms:
                        _tuple_:
                          - _target_: examples.cartpole.regulated_env.DialConfig
                            id: dial
                            action_space:
                              _target_: gymnasium.spaces.Box
                              low: 0.0
                              high: 1.0
                              shape: {_tuple_: [1]}
                              dtype: {_symbol_: numpy.float32}
              - environment:
                  horizon: 1
                  env: {_symbol_: examples.cartpole.regulator_env.CartpoleRegulatorEnv}
                  env_config:
                    aggregation_status: train
              - debugging:
                  seed: 42
              - reporting:
                  queries: {_symbol_: examples.cartpole.queries.ES_QUERIES}
                  schema: {_symbol_: core.optimizers.es.schema.ESSchema}
    - society:
        _args_:
          - _target_: ${algorithms.${params.algo}.optimizer_target}
            _calls_:
              - resources:
                  num_cpus_for_main_process: 1
              - framework:
                  framework: torch
              - api_stack:
                  enable_rl_module_and_learner: true
                  enable_env_runner_and_connector_v2: true
              - environment:
                  env: {_symbol_: examples.cartpole.regulated_env.CartpoleRegulatedEnv}
                  env_config: ${algorithms.${params.algo}.env_config}
                  horizon: ${params.horizon}
                  disable_env_checking: false
                  schema: {_symbol_: examples.cartpole.metric_schema.CartpoleMetricSchema}
                  queries: []
              - env_runners:
                  num_env_runners: 0
                  num_cpus_per_env_runner: 1
                  num_gpus_per_env_runner: 0
                  num_envs_per_env_runner: 1
                  rollout_fragment_length: ${algorithms.${params.algo}.rollout_fragment_length}
                  batch_mode: ${algorithms.${params.algo}.batch_mode}
              - learners:
                  num_learners: 0
                  num_gpus_per_learner: 0
              - callbacks:
                  on_episode_created: {_symbol_: core.callbacks.tag_episode_with_env_idx}
                  on_episode_end: {_symbol_: core.callbacks.log_and_report_episode_metrics}
              - training: ${algorithms.${params.algo}.training}
              - evaluation:
                  evaluation_interval: 1
                  evaluation_duration: 1
                  evaluation_duration_unit: episodes
                  evaluation_num_env_runners: 0
                  evaluation_parallel_to_training: false
                  evaluation_config:
                    explore: false
                    rollout_fragment_length: ${params.horizon}
                    batch_mode: complete_episodes
                  base_seed: 42
                  num_seeds: 1
              - agents:
                  _args_:
                    - _target_: examples.cartpole.regulated_env.CartpoleAgentConfig
                      id: agent_0
                      policy_id: cartpole_policy
                      mechanisms:
                        _tuple_:
                          - _target_: examples.cartpole.regulated_env.PushConfig
                            id: push
                            action_space:
                              _target_: gymnasium.spaces.Discrete
                              _args_: [2]
                      count: 1
                      observation_space:
                        _target_: gymnasium.spaces.Box
                        low: -.inf
                        high: .inf
                        shape: {_tuple_: [4]}
                        dtype: {_symbol_: numpy.float32}
              - fault_tolerance:
                  restart_failed_env_runners: false
              - debugging:
                  seed: 42
                  num_seeds: 1
              - reporting:
                  min_time_s_per_iteration: 0
                  min_sample_timesteps_per_iteration: 0
                  min_train_timesteps_per_iteration: 0
                  queries: {_symbol_: examples.cartpole.queries.INNER_QUERIES}
                  schema: {_symbol_: core.adaptors.ray.schema.RaySchema}

run:
  - build_optimizer: {}
  - train: {}
