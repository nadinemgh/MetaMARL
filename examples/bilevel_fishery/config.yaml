experiment:
  _target_: core.optimizers.bilevel.BilevelConfig

  _calls_:
    - world:
        world_name: fishery_world

    - reporter:
        config:
          _target_: core.reporting.wandb.WandbConfig
          project: bilevel
          quiet: true
          x_disable_stats: true
          x_disable_meta: true
          max_end_of_run_summary_metrics: 0
          max_end_of_run_history_metrics: 0

    - ray:
        device: cpu
        num_cpus: 4
        omp_threads: 1
        logging_level: ERROR
        runtime_env:
          excludes:
            - wandb/
            - .git/
            - .venv/
            - __pycache__/
            - ray_results/
            - runs/

    - regulator:
        cfg:
          _target_: core.optimizers.es.config.ESConfig

          _calls_:
            - training:
                sigma: 0.15
                mean_lr: 0.10
                sigma_decay: 1.0
                sigma_lr: 0.0
                min_sigma: 0.15
                max_sigma: 0.15
                episodes: 1000

            - agents:
                _args_:
                  - _target_: core.agents.base.AgentConfig
                    id: fisheries_regulator
                    policy_id: quota_policy

                    mechanisms:
                      _tuple_:
                        - _target_: core.mechanism.algorithms.quota.Quota
                          id: quota

                          action_space:
                            _target_: gymnasium.spaces.Box
                            low: 0
                            high: 1
                            shape: [1]
                            dtype:
                              _symbol_: numpy.float32

                          acts_on:
                            _tuple_:
                              - fisherman
                              - harvest

                          obs_map:
                            resource_level: fish

                          default:
                            _target_: numpy.asarray
                            _args_: [0.56224]
                            dtype:
                              _symbol_: numpy.float32

            - environment:
                horizon: 1

                env:
                  _symbol_: examples.bilevel_fishery.regulator_env.FisheryRegulatorEnv

                env_config:
                  ecology_cfg:
                    sustainability_weight: 2
                    sustainability_threshold: 0.20

            - debugging:
                seed: 42

            - reporting:
                queries:
                  _symbol_: examples.bilevel_fishery.queries.ES_QUERIES

    - society:
        cfg:
          _target_: core.optimizers.appo.config.APPOptimizerConfig

          _calls_:
            - resources:
                num_cpus_for_main_process: 1

            - framework:
                framework: torch

            - api_stack:
                enable_rl_module_and_learner: true
                enable_env_runner_and_connector_v2: true

            - environment:
                env:
                  _symbol_: examples.bilevel_fishery.regulated_env.FisheryRegulatedEnv

                env_config:
                  ecology_cfg:
                    r: 0.3
                    K: 5000
                    p: 1.0
                    B0: 4000
                    fish_init: 4000
                    sigma: 0.02
                    initial_stock_log_sigma: 0.05
                    unregulated_f_multiplier: 2.0

                  seed: 0

                horizon: 100
                disable_env_checking: false

                schema:
                  _symbol_: examples.bilevel_fishery.metric_schema.FisheryMetricSchema

                queries: []

            - env_runners:
                num_env_runners: 0
                num_cpus_per_env_runner: 1
                num_gpus_per_env_runner: 0
                num_envs_per_env_runner: 4
                rollout_fragment_length: 100
                batch_mode: truncate_episodes
                max_requests_in_flight_per_env_runner: 1

            - learners:
                num_learners: 0
                num_gpus_per_learner: 0

            - callbacks:
                on_episode_created:
                  _symbol_: core.callbacks.tag_episode_with_env_idx

                on_episode_end:
                  _symbol_: core.callbacks.log_and_report_episode_metrics

            - training:
                episodes: 50
                vtrace: true
                circular_buffer_num_batches: 4
                circular_buffer_iterations_per_batch: 1
                broadcast_interval: 1
                timeout_s_sampler_manager: 10
                timeout_s_aggregator_manager: 10
                gamma: 0.99
                lr: 0.001
                train_batch_size_per_learner: 100
                minibatch_size: 100
                num_epochs: 1
                entropy_coeff: 0.001
                grad_clip: 40.0

            - evaluation:
                evaluation_interval: 1
                evaluation_duration: 1
                evaluation_duration_unit: episodes
                evaluation_num_env_runners: 0
                evaluation_parallel_to_training: false
                evaluation_config:
                  explore: false
                  rollout_fragment_length: 100
                  batch_mode: complete_episodes
                  max_requests_in_flight_per_env_runner: 1
                base_seed: 42
                num_seeds: 3

            - agents:
                _args_:
                  - _target_: examples.bilevel_fishery.regulated_env.FishermanConfig
                    id: fisherman
                    policy_id: fisher_policy
                    shared_policy: true
                    count: 10

                    mechanisms:
                      _tuple_:
                        - _target_: examples.bilevel_fishery.regulated_env.FishingConfig
                          id: harvest

                          action_space:
                            _target_: gymnasium.spaces.Box
                            low: -.inf
                            high: .inf
                            shape: [1]
                            dtype:
                              _symbol_: numpy.float32

                        - _target_: examples.bilevel_fishery.regulated_env.RestoreConfig
                          id: restore

                          action_space:
                            _target_: gymnasium.spaces.Box
                            low: -.inf
                            high: .inf
                            shape: [1]
                            dtype:
                              _symbol_: numpy.float32

                    observation_space:
                      _target_: gymnasium.spaces.Box
                      low: -.inf
                      high: .inf
                      shape: [5]
                      dtype:
                        _symbol_: numpy.float32

            - fault_tolerance:
                restart_failed_env_runners: false

            - debugging:
                seed: 42
                num_seeds: 1

            - reporting:
                min_time_s_per_iteration: 0
                min_sample_timesteps_per_iteration: 0
                min_train_timesteps_per_iteration: 0

                queries:
                  _symbol_: examples.bilevel_fishery.queries.INNER_QUERIES

run:
  - build_optimizer: {}
  - train: {}